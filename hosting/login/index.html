<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Entrar · GameForge Sync</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Segoe UI", sans-serif; color: #f1ebf8;
      background: radial-gradient(1000px 500px at 20% -10%, #2b1b3d 0%, transparent 60%), radial-gradient(800px 400px at 110% 110%, #3a2216 0%, transparent 55%), #120f19; }
    .card { width: min(420px, calc(100vw - 32px)); background: #1b1625; border: 1px solid #30273f; border-radius: 16px; padding: 28px; text-align: center; box-shadow: 0 20px 60px #0008; }
    .logo { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 14px; display: grid; place-items: center; font-weight: 900; font-size: 22px; color: #1c1205; background: linear-gradient(135deg, #ff9d4d, #ff5f7e); }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { color: #9a8fb0; line-height: 1.5; margin: 0 0 18px; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #ff9d4d; color: #1c1205; font: 700 15px system-ui; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .err { margin-top: 14px; color: #ffb3bd; background: #3a1820; border: 1px solid #6b2a36; border-radius: 8px; padding: 10px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">GF</div>
    <h1>GameForge Sync</h1>
    <p id="msg">Entre com sua conta Google para voltar ao app.</p>
    <button id="go">Entrar com Google</button>
    <div class="err" id="err"></div>
  </div>
  <script type="module">
    // Página de login do app de PC e do gfs: faz o login Google aqui no navegador normal
    // (o Google não deixa logar dentro de WebView) e devolve o id_token para o programa
    // que está escutando em 127.0.0.1:<porta> no próprio computador.
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const app = initializeApp({
      apiKey: "AIzaSyBuFsgekAZdraWUeAx0zpEJQwGi5AGRnks",
      authDomain: "gameforge-sync.firebaseapp.com",
      projectId: "gameforge-sync",
      appId: "1:763579522878:web:6dca74b5cc9235ccfa566f",
    });
    const auth = getAuth(app);

    const params = new URLSearchParams(location.search);
    const port = Number(params.get("port"));
    const state = params.get("state") || "";
    const btn = document.getElementById("go");
    const err = document.getElementById("err");
    const msg = document.getElementById("msg");

    const fail = (text) => { err.textContent = text; err.style.display = "block"; btn.disabled = false; };

    if (!Number.isInteger(port) || port < 1024 || port > 65535 || !/^[\w-]{20,}$/.test(state)) {
      btn.disabled = true;
      fail("Abra esta página pelo botão “Entrar com Google” do app GameForge Sync.");
    }

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      err.style.display = "none";
      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });
        const result = await signInWithPopup(auth, provider);
        const idToken = GoogleAuthProvider.credentialFromResult(result)?.idToken;
        await signOut(auth); // a sessão de verdade fica no app, não aqui
        if (!idToken) throw new Error("O Google não devolveu o token.");
        msg.textContent = "Pronto! Voltando para o app…";
        btn.style.display = "none";
        const back = new URL(`http://127.0.0.1:${port}/callback`);
        back.searchParams.set("state", state);
        back.searchParams.set("id_token", idToken);
        location.replace(back.toString());
      } catch (e) {
        if (e?.code === "auth/popup-closed-by-user" || e?.code === "auth/cancelled-popup-request") { btn.disabled = false; return; }
        fail(e?.message || String(e));
      }
    });
  </script>
</body>
</html>
