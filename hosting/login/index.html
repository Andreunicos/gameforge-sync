<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Entrar · GameForge Sync</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, "Segoe UI", sans-serif; color: #f1ebf8;
      background: radial-gradient(1000px 500px at 20% -10%, #2b1b3d 0%, transparent 60%), radial-gradient(800px 400px at 110% 110%, #3a2216 0%, transparent 55%), #120f19; }
    .card { width: min(420px, calc(100vw - 32px)); background: #1b1625; border: 1px solid #30273f; border-radius: 16px; padding: 28px; text-align: center; box-shadow: 0 20px 60px #0008; box-sizing: border-box; }
    .logo { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 14px; display: grid; place-items: center; font-weight: 900; font-size: 22px; color: #1c1205; background: linear-gradient(135deg, #ff9d4d, #ff5f7e); }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { color: #9a8fb0; line-height: 1.5; margin: 0 0 18px; }
    p b { color: #f1ebf8; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #ff9d4d; color: #1c1205; font: 700 15px system-ui; cursor: pointer; }
    button.alt { background: #2a2238; color: #f1ebf8; border: 1px solid #3d3252; }
    button:disabled { opacity: .6; cursor: default; }
    input { width: 100%; box-sizing: border-box; padding: 11px 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #3d3252; background: #120f19; color: #f1ebf8; font: 15px system-ui; }
    .or { display: flex; align-items: center; gap: 10px; color: #6f6585; font-size: 13px; margin: 18px 0; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: #30273f; }
    .err { margin-top: 14px; color: #ffb3bd; background: #3a1820; border: 1px solid #6b2a36; border-radius: 8px; padding: 10px; display: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">GF</div>
    <h1>GameForge Sync</h1>
    <p id="msg">Entre para voltar ao app.</p>

    <div id="choose">
      <button id="google">Entrar com Google</button>
      <div class="or">ou com e-mail (Hotmail, Outlook…)</div>
      <input id="email" type="email" autocomplete="email" placeholder="seu@hotmail.com">
      <button id="send" class="alt">Mandar link de acesso</button>
    </div>

    <div id="confirm" hidden>
      <input id="email2" type="email" autocomplete="email" placeholder="o mesmo e-mail que recebeu o link">
      <button id="finish">Entrar</button>
    </div>

    <div class="err" id="err"></div>
  </div>
  <script type="module">
    // Página de login do app de PC e do gfs (o Google não deixa logar dentro de WebView).
    // Devolve para o programa que está escutando em 127.0.0.1:<porta> no próprio computador:
    //  - Google: o id_token do Google;
    //  - e-mail (Hotmail etc.): "emaillink:" + {email, link}. O link do e-mail NÃO é usado aqui:
    //    quem entra com ele é o app, então a sessão fica só no app.
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, sendSignInLinkToEmail, isSignInWithEmailLink } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const app = initializeApp({
      apiKey: "AIzaSyBuFsgekAZdraWUeAx0zpEJQwGi5AGRnks",
      authDomain: "gameforge-sync.firebaseapp.com",
      projectId: "gameforge-sync",
      appId: "1:763579522878:web:6dca74b5cc9235ccfa566f",
    });
    const auth = getAuth(app);
    auth.languageCode = "pt";

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const port = Number(params.get("port"));
    const state = params.get("state") || "";
    const err = $("err");
    const msg = $("msg");
    const EMAIL_KEY = "gfs-login-email";

    const fail = (text) => { err.textContent = text; err.style.display = "block"; for (const b of document.querySelectorAll("button")) b.disabled = false; };
    const store = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
    const stored = (k) => { try { return localStorage.getItem(k); } catch { return null; } };

    const back = (token) => {
      msg.textContent = "Pronto! Voltando para o app…";
      $("choose").hidden = $("confirm").hidden = true;
      const url = new URL(`http://127.0.0.1:${port}/callback`);
      url.searchParams.set("state", state);
      url.searchParams.set("id_token", token);
      location.replace(url.toString());
    };

    const validReturn = Number.isInteger(port) && port >= 1024 && port <= 65535 && /^[\w-]{20,}$/.test(state);

    if (!validReturn) {
      $("choose").hidden = true;
      fail("Abra esta página pelo botão “Entrar” do app GameForge Sync.");
    } else if (isSignInWithEmailLink(auth, location.href)) {
      // Voltou pelo link do e-mail: entrega o link para o app.
      $("choose").hidden = true;
      const email = stored(EMAIL_KEY);
      if (email) {
        store(EMAIL_KEY, null);
        back("emaillink:" + JSON.stringify({ email, link: location.href }));
      } else {
        // Link aberto em outro navegador: confirma o e-mail.
        msg.textContent = "Confirme o e-mail que recebeu este link.";
        $("confirm").hidden = false;
        $("finish").addEventListener("click", () => {
          const e = $("email2").value.trim().toLowerCase();
          if (!e.includes("@")) return fail("Digite o e-mail.");
          back("emaillink:" + JSON.stringify({ email: e, link: location.href }));
        });
      }
    }

    $("google").addEventListener("click", async () => {
      $("google").disabled = true;
      err.style.display = "none";
      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });
        const result = await signInWithPopup(auth, provider);
        const idToken = GoogleAuthProvider.credentialFromResult(result)?.idToken;
        await signOut(auth); // a sessão de verdade fica no app, não aqui
        if (!idToken) throw new Error("O Google não devolveu o token.");
        back(idToken);
      } catch (e) {
        if (e?.code === "auth/popup-closed-by-user" || e?.code === "auth/cancelled-popup-request") { $("google").disabled = false; return; }
        fail(e?.message || String(e));
      }
    });

    $("send").addEventListener("click", async () => {
      const email = $("email").value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail("Digite um e-mail válido.");
      $("send").disabled = true;
      err.style.display = "none";
      try {
        // O link volta para esta mesma página (com a porta e o state do app).
        const url = new URL(location.origin + location.pathname);
        url.searchParams.set("port", String(port));
        url.searchParams.set("state", state);
        await sendSignInLinkToEmail(auth, email, { url: url.toString(), handleCodeInApp: true });
        store(EMAIL_KEY, email);
        $("choose").hidden = true;
        msg.innerHTML = "";
        msg.append("Mandamos um link para ", Object.assign(document.createElement("b"), { textContent: email }),
          ". Abra o e-mail neste computador e clique no link (olhe também o lixo eletrônico). Faça isso em até 5 minutos, com o app aberto.");
      } catch (e) {
        if (e?.code === "auth/operation-not-allowed") fail("O login por e-mail ainda não está ligado no Firebase.");
        else fail(e?.message || String(e));
      }
    });
  </script>
</body>
</html>
