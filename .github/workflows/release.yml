# Publica uma versão nova do app.
# Como usar: suba "version" em app/package.json, faça commit, crie a tag e mande:
#   git tag v0.1.1 && git push origin main --tags
# O Actions compila, assina e publica a Release com o instalador e o latest.json.
# O app de quem já instalou vê a versão nova ao abrir.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Cache compartilhado: as tags leem o cache que o rust-cache.yml grava na main
      # (tag nova não enxerga cache de outra tag, por isso cada build começava do zero).
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          shared-key: tauri-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Instalar dependências
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: GameForge Sync v__VERSION__
          releaseBody: |
            **Instalar:** baixe aqui embaixo (em Assets) o arquivo que termina em `x64-setup.exe` e abra.
            Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo** (o app ainda não tem certificado pago de assinatura).

            Quem já tem o app instalado recebe esta versão sozinho ao abrir.

            **Claude:** instale ou atualize a ponte do Claude com `npm i -g https://github.com/Andreunicos/gameforge-sync/releases/latest/download/gfs.tgz` (no app: botão 🤖 Conectar Claude).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  # A ferramenta do Claude (gfs) vai junto em toda release:
  #   npm i -g https://github.com/Andreunicos/gameforge-sync/releases/latest/download/gfs.tgz
  gfs:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gfs/package-lock.json

      - name: Empacotar o gfs
        working-directory: gfs
        run: |
          npm ci
          npm run build
          node dist/gfs.mjs --version
          mv "$(npm pack --silent)" gfs.tgz

      - name: Anexar à release
        working-directory: gfs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" gfs.tgz --clobber
